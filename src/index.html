<!doctype html>
<html lang="de">

<head>
	<meta charset="utf-8">
	<title>Health Insurance</title>
	<base href="/">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" type="image/png" href="/favicon-96x96.png?v=20261018" sizes="96x96" />
	<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20261018" />
	<link rel="shortcut icon" href="/favicon.ico?v=20261018" />
	<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20261018" />
	<meta name="apple-mobile-web-app-title" content="Health" />
	<link rel="manifest" href="/site.webmanifest?v=20261018" />

    <script>
      (function () {
        const html = document.documentElement;

        try {
          const theme = localStorage.theme;
          const prefersDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches ?? false;

          const isSystem = theme === 'system' || !('theme' in localStorage);
          const isDark = theme === 'dark' || (isSystem && prefersDark);
          html.classList.add('scheme-light-dark');
          html.classList.toggle('dark', isDark);
          html.setAttribute('data-theme', theme ?? 'system');
        } catch (_) {}
      })();
    </script>

  </head>

<body>
	<app-root></app-root>
</body>

</html>
