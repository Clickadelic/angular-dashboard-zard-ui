@if (isOpen()) {
<!-- Backdrop -->
<div class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">

	<!-- Modal Content Box -->
	<div class="relative w-full max-w-md rounded-lg border border-border bg-white p-6 shadow-lg">

		<!-- Schließen-Button -->
		<button type="button" (click)="close()"
			class="absolute right-4 top-4 text-gray-400 hover:text-gray-700 text-sm font-bold cursor-pointer">
			✕
		</button>

		<!-- Content Projection für den Inhalt -->
		<ng-content />

	</div>
</div>
}
