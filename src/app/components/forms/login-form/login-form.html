<form class="w-full flex flex-col gap-4 items-center justify-between" (ngSubmit)="onSubmit()">
	<div class="flex flex-col gap-2 w-full">
		<label class="text-gray-600 font-medium">E-Mail:</label>
		<input type="email" name="email" placeholder="E-Mail" autocomplete="username"
			class="placeholder:text-gray-400 text-gray-600 border border-gray-300 rounded px-3 py-2 w-full"
			[(ngModel)]="credentials.email" />
	</div>
	<div class="flex flex-col gap-2 w-full">
		<label class="text-gray-600 font-medium">Passwort:</label>
		<input type="password" name="password" placeholder="Passwort" autocomplete="current-password"
			class="placeholder:text-gray-400 text-gray-600 border border-gray-300 rounded px-3 py-2 w-full"
			[(ngModel)]="credentials.password" />
	</div>
	<div class="flex gap-2 mr-auto p-2"><input type="checkbox" name="remember-me" />
		<label for="remember-me" class="text-gray-400">Angemeldet bleiben</label>
	</div>
	<button type="submit"
		class="bg-primary hover:cursor-pointer text-white px-4 py-2 rounded w-full hover:bg-primary-dark transition-colors duration-300">Anmelden</button>
</form>
