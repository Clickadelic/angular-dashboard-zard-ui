<form class="w-full text-base flex flex-col gap-4 items-center justify-between mb-5" (ngSubmit)="onSubmit()">
	<div class="flex flex-col gap-2 w-full">
		<label class="text-accent font-bold">E-Mail:</label>
		<input type="email" name="email" placeholder="E-Mail" autocomplete="username"
			class=" placeholder:text-gray-400 text-gray-600 border border-gray-300 rounded px-3 py-2 w-full"
			[(ngModel)]="credentials.email" />
	</div>
	<app-button class="w-full">Passwort zurücksetzen</app-button>
</form>
<p class="text-gray-600 text-center text-sm mb-5">Zum Login? <a href="/auth/login" class="text-primary hover:underline"
		title="Zum Login">Hier anmelden</a>.
</p>
