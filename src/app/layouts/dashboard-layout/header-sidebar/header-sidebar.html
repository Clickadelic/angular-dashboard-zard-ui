<!-- Sidebar mit flüssiger Ein- und Ausblend-Animation -->
<aside
	class="fixed top-0 left-0 w-64 p-4 h-full bg-white flex flex-col items-center justify-center transition-transform duration-300 z-40"
	[class.-translate-x-full]="!isOpen()">

	<h1 class="w-full text-center text-xl">
		<a routerLink="/" class="text-primary font-bebas-neue flex items-center justify-center gap-2"
			title="Zur Startseite">
			<img src="../../../assets/svgs/health-svgrepo-com.svg" alt="Logo" class="h-6" />
			Health Insurance
		</a>
	</h1>

	<nav class="mt-8 w-full flex flex-col items-start grow" aria-label="Hauptnavigation" role="navigation">
		<ul class="flex flex-col items-start justify-between w-full gap-0.5">
			<li class="text-gray-400 ml-2 mb-2 text-sm font-bold">Dashboard</li>
			<li class="w-full">
				<a routerLink="/"
					class="flex items-center gap-1.5 w-full rounded py-1 px-2 hover:ml-2 transition-all hover:bg-primary hover:text-primary-foreground">
					<svg lucideHouse class="size-4"></svg> Home
				</a>
			</li>
			<li class="w-full">
				<a routerLink="/dashboard"
					class="flex items-center gap-1.5 w-full rounded py-1 px-2 hover:ml-2 transition-all hover:bg-primary hover:text-primary-foreground">
					<svg lucideGauge class="size-4"></svg> Dashboard
				</a>
			</li>
			<li class="w-full">
				<a routerLink="/dashboard/component-library"
					class="flex items-center gap-1.5 w-full rounded py-1 px-2 hover:ml-2 transition-all hover:bg-primary hover:text-primary-foreground">
					<svg lucideLayers class="size-4"></svg> Component Library
				</a>
			</li>
			<li class="text-gray-400 ml-2 mb-2 text-sm font-bold mt-3">Verwaltung</li>
			<li class="w-full">
				<a routerLink="/dashboard/kunden"
					class="flex items-center gap-1.5 w-full rounded py-1 px-2 hover:ml-2 transition-all hover:bg-primary hover:text-primary-foreground">
					<svg lucideUsers class="size-4"></svg> Kunden
				</a>
			</li>
			<li class="w-full">
				<a routerLink="/dashboard/vertraege"
					class="flex items-center gap-1.5 w-full rounded py-1 px-2 hover:ml-2 transition-all hover:bg-primary hover:text-primary-foreground">
					<svg lucideReceiptText class="size-4"></svg> Verträge
				</a>
			</li>
			<li class="w-full">
				<a routerLink="/dashboard/kontaktanfragen"
					class="flex items-center gap-1.5 w-full rounded py-1 px-2 hover:ml-2 transition-all hover:bg-primary hover:text-primary-foreground">
					<svg lucideMailPen class="size-4"></svg> Kontaktanfragen
				</a>
			</li>
		</ul>
	</nav>

	<div class="w-full p-2">
		<button (click)="logout()" class="w-full flex items-center gap-1.5 hover:cursor-pointer hover:text-accent">
			<svg lucideLogOut></svg> Abmelden
		</button>
	</div>
</aside>

<!-- Header passt seinen linken Außenabstand (Margin-Left) dynamisch an -->
<header class="p-3 w-auto bg-white flex items-center justify-between border-b border-border transition-all duration-300"
	[class.ml-64]="isOpen()" [class.ml-0]="!isOpen()">

	<div class="flex items-center gap-5">
		<!-- Toggle Button -->
		<button type="button" (click)="onToggleClick()"
			class="rounded bg-base p-1 text-base text-gray-400 hover:cursor-pointer hover:text-primary transition-transform"
			[title]="isOpen() ? 'Panel schließen' : 'Panel öffnen'">
			<svg lucidePanelRightOpen [class.rotate-180]="!isOpen()"></svg>
		</button>

		<form class="w-72">
			<input type="text" id="app-search" name="app-search"
				class="w-full px-2 py-1 border rounded placeholder:text-gray-400" placeholder="Suche... STRG + K" />
		</form>
	</div>

	<!-- Dropdown-Komponente mit gebundenem Benutzernamen -->
	<app-dropdown [userName]="currentUser().name" class="mr-4">
		<div dropdown-content class="w-48">
			<app-dropdown-item>Profil</app-dropdown-item>
			<app-dropdown-item routerLink="/dashboard/settings">Einstellungen</app-dropdown-item>
			<div class="h-px my-1 bg-border"></div>
			<app-dropdown-item (click)="logout()" class="text-destructive hover:text-destructive">
				Abmelden
			</app-dropdown-item>
		</div>
	</app-dropdown>
</header>
