<z-card class="w-full">
	<z-card-header>
		<z-card-title [zTitle]="title()" />

		@if (description()) {
		<z-card-description [zDescription]="description()" />
		}
	</z-card-header>

	<z-card-content>
		<ng-content />
	</z-card-content>

	@if (footer()) {
	<z-card-footer>
		<span class="text-sm text-muted-foreground">
			{{ footer() }}
		</span>
	</z-card-footer>
	}
</z-card>
