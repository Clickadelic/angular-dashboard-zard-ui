<z-sidebar-provider zDefaultOpen="true" class="min-h-dvh border">
	<z-sidebar zCollapsible="icon">

		<!-- Header / Logo -->
		<z-sidebar-header>
			<a routerLink="/dashboard" class="flex items-center gap-2 px-2 py-2">
				<img src="../../../assets/images/favicon-96x96.png" alt="Logo" class="size-8 shrink-0" />

				<span class="truncate font-semibold">
					Health Insurance
				</span>
			</a>
		</z-sidebar-header>

		<!-- Navigation -->
		<z-sidebar-content>

			<!-- Gruppe: Workspace -->
			<div z-sidebar-group>
				<div z-sidebar-group-label>Workspace</div>

				<div z-sidebar-group-content>
					<ul z-sidebar-menu>

						<li z-sidebar-menu-item>
							<a z-sidebar-menu-button routerLink="/dashboard" zTooltip="Dashboard">
								<ng-icon name="lucideHouse" />
								<span>Dashboard</span>
							</a>
						</li>
					</ul>
				</div>
			</div>

			<!-- Gruppe: Development -->
			<div z-sidebar-group>
				<div z-sidebar-group-label>Development</div>

				<div z-sidebar-group-content>
					<ul z-sidebar-menu>

						<li z-sidebar-menu-item>
							<a z-sidebar-menu-button routerLink="/dashboard/settings" zTooltip="Development">
								<ng-icon name="lucideInbox" />
								<span>Einstellungen</span>
							</a>
						</li>

					</ul>
				</div>
			</div>

			<!-- Gruppe: Administration -->
			<div z-sidebar-group>
				<div z-sidebar-group-label>Administration</div>

				<div z-sidebar-group-content>
					<ul z-sidebar-menu>

						<li z-sidebar-menu-item>
							<a z-sidebar-menu-button routerLink="/dashboard/administration" zTooltip="Administration">
								<ng-icon name="lucideSettings" />
								<span>Administration</span>
							</a>
						</li>
					</ul>
				</div>
			</div>

		</z-sidebar-content>

		<!-- Footer / Benutzermenü -->
		<z-sidebar-footer>
			<div z-sidebar-menu>
				<div z-sidebar-menu-item>

					<button z-sidebar-menu-button zTooltip="Benutzername" class="h-auto py-2">
						<div
							class="flex size-8 shrink-0 items-center justify-center rounded-full bg-primary text-primary-foreground">
							TH
						</div>

						<div class="flex min-w-0 flex-1 flex-col items-start">
							<span class="truncate text-sm font-medium">
								Tobias
							</span>

							<span class="truncate text-xs text-muted-foreground">
								tobiasATexample.com
							</span>
						</div>

						<ng-icon name="lucideChevronsUpDown" />
					</button>

				</div>
			</div>
		</z-sidebar-footer>

	</z-sidebar>

	<!-- Hauptbereich -->
	<main z-sidebar-inset class="flex min-h-dvh flex-col">

		<header class="flex h-14 shrink-0 items-center gap-3 border-b px-4">
			<button z-sidebar-trigger aria-label="Toggle Sidebar"></button>

			<div class="flex-1">
				<h1 class="text-lg font-semibold">Dashboard</h1>
			</div>
		</header>

		<section class="flex-1 p-4">
			<router-outlet />
		</section>

	</main>
</z-sidebar-provider>
