<z-sidebar-provider>
	<z-sidebar zCollapsible="icon">

		<!-- Logo / Header -->
		<div z-sidebar-header>
			<a routerLink="/dashboard" class="flex items-center gap-2 p-2 font-semibold">
				<img src="../../assets/images/favicon-96x96.png" class="size-8" alt="Health Insurance Logo" />
				<span>Health Insurance</span>
			</a>
		</div>

		<!-- Navigation -->
		<z-sidebar-content>
			<div z-sidebar-group>
				<div z-sidebar-group-label>
					Übersicht
				</div>

				<div z-sidebar-group-content>
					<ul z-sidebar-menu>
						<li z-sidebar-menu-item>
							<a z-sidebar-menu-button routerLink="/dashboard" zTooltip="Dashboard">
								Dashboard
							</a>
						</li>

						<li z-sidebar-menu-item>
							<a z-sidebar-menu-button routerLink="/dashboard/settings" zTooltip="Einstellungen">
								Component Library
							</a>
						</li>
					</ul>
				</div>
			</div>
		</z-sidebar-content>

		<!-- Footer -->
		<div z-sidebar-footer>
			<div class="p-2 text-sm text-muted-foreground">
				Angemeldet
			</div>
		</div>

		<button z-sidebar-rail aria-label="Sidebar umschalten"></button>
	</z-sidebar>

	<!-- Main content -->
	<main z-sidebar-inset class="min-h-svh">
		<header class="bg-white dark:bg-sidebar flex h-14 items-center justify-between gap-2 px-4">
			<div><button z-sidebar-trigger aria-label="Sidebar umschalten"></button>
				<span class="font-medium">Health Insurance</span>
			</div>
			<div>
				<app-dark-mode-toggle></app-dark-mode-toggle>
			</div>
		</header>
		<div class="p-6">
			<router-outlet />
		</div>
	</main>
</z-sidebar-provider>
