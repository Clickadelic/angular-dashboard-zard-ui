<div class="flex flex-col gap-3 mb-8 max-w-96 items-start justify-between">
	<h3 class="text-2xl font-bebas-neue">Einstellungen</h3>
	<!-- Tab-Navigationsleiste (shadcn-Stil) -->
	<div class="inline-flex h-10 items-center justify-center rounded-lg bg-gray-100 p-1 text-gray-500">
		<button type="button" (click)="setTab('profile')" [class.bg-white]="activeTab() === 'profile'"
			[class.text-gray-950]="activeTab() === 'profile'" [class.shadow-sm]="activeTab() === 'profile'"
			class="inline-flex items-center justify-center whitespace-nowrap rounded-md px-3 py-1.5 text-sm font-medium transition-all cursor-pointer">
			Profil
		</button>
		<button type="button" (click)="setTab('security')" [class.bg-white]="activeTab() === 'security'"
			[class.text-gray-950]="activeTab() === 'security'" [class.shadow-sm]="activeTab() === 'security'"
			class="inline-flex items-center justify-center whitespace-nowrap rounded-md px-3 py-1.5 text-sm font-medium transition-all cursor-pointer">
			Sicherheit
		</button>
		<button type="button" (click)="setTab('notifications')" [class.bg-white]="activeTab() === 'notifications'"
			[class.text-gray-950]="activeTab() === 'notifications'" [class.shadow-sm]="activeTab() === 'notifications'"
			class="inline-flex items-center justify-center whitespace-nowrap rounded-md px-3 py-1.5 text-sm font-medium transition-all cursor-pointer">
			Benachrichtigungen
		</button>
	</div>
	<!-- Tab Panel 1: Profil -->
	@if (activeTab() === 'profile') {
	<div class="rounded-xl border border-border bg-white p-6 shadow-sm space-y-4">
		<h2 class="text-lg font-semibold">Profil-Informationen</h2>
		<div class="space-y-2">
			<label class="text-sm font-medium block">Name</label>
			<input type="text" value="Tobias Hopp" class="w-full px-3 py-2 border border-border rounded-md text-sm" />
		</div>
		<div class="space-y-2">
			<label class="text-sm font-medium block">E-Mail-Adresse</label>
			<input type="email" value="tobias@example.com"
				class="w-full px-3 py-2 border border-border rounded-md text-sm" />
		</div>
		<div class="pt-2">
			<button (click)="saveProfile()"
				class="px-4 py-2 bg-primary text-primary-foreground rounded-md text-sm font-medium cursor-pointer">
				Änderungen speichern
			</button>
		</div>
	</div>
	}

	<!-- Tab Panel 2: Sicherheit -->
	@if (activeTab() === 'security') {
	<div class="rounded-xl border border-border bg-white p-6 shadow-sm space-y-4">
		<h2 class="text-lg font-semibold">Passwort ändern</h2>
		<div class="space-y-2">
			<label class="text-sm font-medium block">Aktuelles Passwort</label>
			<input type="password" class="w-full px-3 py-2 border border-border rounded-md text-sm" />
		</div>
		<div class="space-y-2">
			<label class="text-sm font-medium block">Neues Passwort</label>
			<input type="password" class="w-full px-3 py-2 border border-border rounded-md text-sm" />
		</div>
		<div class="pt-2">
			<button class="px-4 py-2 bg-primary text-primary-foreground rounded-md text-sm font-medium cursor-pointer">
				Passwort aktualisieren
			</button>
		</div>
	</div>
	}

	<!-- Tab Panel 3: Benachrichtigungen -->
	@if (activeTab() === 'notifications') {
	<div class="rounded-xl border border-border bg-white p-6 shadow-sm space-y-4">
		<h2 class="text-lg font-semibold">Benachrichtigungseinstellungen</h2>
		<div class="flex items-center justify-between">
			<div>
				<p class="text-sm font-medium">E-Mail Benachrichtigungen</p>
				<p class="text-xs text-gray-500">Erhalte Updates zu Kontoaktivitäten per E-Mail.</p>
			</div>
			<input type="checkbox" checked class="h-4 w-4 rounded border-gray-300" />
		</div>
	</div>
	}
</div>
