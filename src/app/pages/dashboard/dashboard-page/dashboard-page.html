<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8 mb-8">
	<app-dashboard-card title="Kundenaufträge">
		<div class="flex items-center justify-between mb-3">
			<h4 class="card-foreground dark:card-foreground font-bold text-xl">4.432</h4>
			<div class="flex items-center justify-between gap-2 px-2 py-1 bg-primary/20 rounded border border-primary">
				<svg lucideTrendingUp class="size-4 text-primary"></svg>
				<span class="text-primary">+ 17%</span>
			</div>
		</div>
		<p class="text-muted-foreground text-sm">Es wurden <span class="text-primary">4.432</span>
			Kundenaufträge erfasst.</p>
	</app-dashboard-card>
	<app-dashboard-card title="Versicherungsnehmer insgesamt">
		<div class="flex items-center justify-between mb-3">
			<h4 class="card-foreground dark:card-foreground font-bold text-xl">54.232</h4>
			<div
				class="flex items-center justify-between gap-2 px-2 py-1 bg-emerald-300/20 dark:bg-emerald-300/20 rounded border border-emerald-300">
				<svg lucideTrendingUp class="size-4 text-emerald-800 dark:text-emerald-300"></svg>
				<span class="text-emerald-800 dark:text-emerald-300">+ 5%</span>
			</div>
		</div>
		<p class="text-muted-foreground text-sm">Diesen Monat wurden <span class="text-emerald-800">3.525</span>
			Neukunden versichert.</p>
	</app-dashboard-card>
	<app-dashboard-card title="Kundenanfragen insgesamt">
		<div class="flex items-center justify-between mb-3">
			<h4 class="card-foreground dark:card-foreground font-bold text-xl">2.432</h4>
			<div
				class="flex items-center justify-between gap-2 px-2 py-1 bg-destructive/20 rounded border border-rose-300">
				<svg lucideTrendingDown class="size-4 text-rose-800 dark:text-rose-300"></svg>
				<span class="text-rose-800 dark:text-rose-300">- 5%</span>
			</div>
		</div>
		<p class="text-muted-foreground text-sm">Es wurden <span class="text-destructive">345</span>
			weniger Krankheitsfälle gemeldet.</p>
	</app-dashboard-card>
	<app-dashboard-card title="Vertragsänderungen">
		<div class="flex items-center justify-between mb-3">
			<h4 class="card-foreground dark:card-foreground font-bold text-xl">1.862</h4>
			<div
				class="flex items-center justify-between gap-2 px-2 py-1 bg-amber-300/20 rounded border border-amber-300">
				<svg lucideMoveRight class="size-4 text-amber-600 dark:text-amber-300"></svg>
				<span class="text-amber-600 dark:text-amber-300">+ 1%</span>
			</div>
		</div>
		<p class="text-muted-foreground text-sm">Diesen Monat wurden <span class="text-amber-600">932</span>
			Verträge geändert.</p>
	</app-dashboard-card>
</div>
<div class="grid grid-cols-10 gap-8 mb-8">
	<div class="col-span-3">
		<app-dashboard-card title="Statistiken">
			<app-bar-chart></app-bar-chart>
		</app-dashboard-card>
	</div>
	<div class="col-span-3">
		<app-dashboard-card title="Statistiken">
			<app-wave-chart></app-wave-chart>
		</app-dashboard-card>
	</div>
	<div class="col-span-4">
		<app-dashboard-card title="Todo-List" class="flex h-full">
			<app-todo-list></app-todo-list>
		</app-dashboard-card>
	</div>
</div>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
	@for (user of users; track user.id) {
	<app-user-card [user]="user" />
	}
</div>
