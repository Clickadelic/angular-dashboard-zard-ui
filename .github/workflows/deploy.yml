name: Deploy angular.tobias-hopp.de

on:
    push:
        branches: ["prod"]
    workflow_dispatch:

concurrency:
    group: deploy-angular-prod
    cancel-in-progress: true

permissions:
    contents: read

env:
    NODE_VERSION: "24"

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment: production

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Install Node dependencies
              run: npm ci

            - name: Run tests (Angular unit-test builder)
              run: npm run test -- --no-watch

            - name: Build (Angular, production)
              run: npm run build -- --configuration production

            - name: Write SSH key (base64 secret)
              shell: bash
              env:
                  KEY_B64: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY_B64 }}
              run: |
                  set -euo pipefail
                  mkdir -p "$HOME/.ssh"
                  chmod 700 "$HOME/.ssh"

                  KEY="$HOME/.ssh/web_deploy_key"

                  if [ -z "$KEY_B64" ]; then
                    echo "::error title=Missing secret::DEPLOY_SSH_PRIVATE_KEY_B64 is not set"
                    exit 1
                  fi

                  echo "$KEY_B64" | base64 -d > "$KEY"
                  chmod 600 "$KEY"
                  ssh-keygen -lf "$KEY" >/dev/null

            - name: Add host key
              shell: bash
              run: |
                  set -euo pipefail
                  HOST="${{ secrets.DEPLOY_HOST }}"
                  PORT="${{ secrets.DEPLOY_PORT }}"; [ -z "$PORT" ] && PORT=22
                  ssh-keyscan -p "$PORT" -t rsa,ed25519 -H "$HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null

            - name: Probe SSH connectivity
              shell: bash
              run: |
                  set -euo pipefail
                  PORT="${{ secrets.DEPLOY_PORT }}"; [ -z "$PORT" ] && PORT=22
                  ssh -i "$HOME/.ssh/web_deploy_key" \
                    -o BatchMode=yes \
                    -o StrictHostKeyChecking=yes \
                    -o IdentitiesOnly=yes \
                    -p "$PORT" \
                    "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" echo ok

            - name: Ensure remote directory exists
              shell: bash
              run: |
                  set -euo pipefail
                  PORT="${{ secrets.DEPLOY_PORT }}"; [ -z "$PORT" ] && PORT=22
                  ssh -i "$HOME/.ssh/web_deploy_key" \
                    -o BatchMode=yes \
                    -o StrictHostKeyChecking=yes \
                    -o IdentitiesOnly=yes \
                    -p "$PORT" \
                    "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
                    "mkdir -p \"${{ secrets.DEPLOY_PATH }}\""

            - name: Upload built static assets (tar stream)
              shell: bash
              run: |
                  set -euo pipefail
                  PORT="${{ secrets.DEPLOY_PORT }}"; [ -z "$PORT" ] && PORT=22
                  REMOTE="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
                  REMOTE_PATH="${{ secrets.DEPLOY_PATH }}"

                  tar -C dist/modern-angular/browser -czf - . \
                  | ssh -i "$HOME/.ssh/web_deploy_key" \
                      -o BatchMode=yes \
                      -o StrictHostKeyChecking=yes \
                      -o IdentitiesOnly=yes \
                      -p "$PORT" \
                      "$REMOTE" "tar -xzf - -C \"$REMOTE_PATH\""

            - name: Verify static deployment
              shell: bash
              run: |
                  set -euo pipefail
                  PORT="${{ secrets.DEPLOY_PORT }}"; [ -z "$PORT" ] && PORT=22

                  ssh -i "$HOME/.ssh/web_deploy_key" \
                    -o BatchMode=yes \
                    -o StrictHostKeyChecking=yes \
                    -o IdentitiesOnly=yes \
                    -p "$PORT" \
                    "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
                    "chmod -R a+rX \"${{ secrets.DEPLOY_PATH }}\" && test -s \"${{ secrets.DEPLOY_PATH }}/index.html\" && ls \"${{ secrets.DEPLOY_PATH }}\"/main-*.js >/dev/null"

            - name: Verify public site
              shell: bash
              run: curl --fail --silent --show-error --location --retry 3 --retry-delay 5 https://health-insurance.tobias-hopp.de/ | grep -q '<app-root'
